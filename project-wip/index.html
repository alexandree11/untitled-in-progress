<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>To Do List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <p id="task-counter">...</p>
  <div id="filter-buttons">
    <button class="filter-btn" data-filter="all">All</button>
    <button class="filter-btn selected" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
  </div>

  <h1>Tasks list</h1>
  <button id="open-modal-btn">New task</button>

  <input type="search" id="search-input" placeholder="Search tasks...">

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <button id="close-modal-btn" class="modal-close">×</button>
      <h2 id="modal-title">New task</h2>

      <input type="text" id="task-title" placeholder="Task name">
      <input type="text" id="task-desc" placeholder="Description (optional)">
      <select id="task-priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <label>
        Deadline
        <input type="datetime-local" id="task-deadline">
      </label>

      <button id="save-task-btn">Add</button>
    </div>
  </div>

  <div id="action-bar" class="action-bar hidden">
    <span id="action-bar-count">0 selected</span>
    <button id="complete-task-btn">Complete</button>
    <button id="return-task-btn">Return</button>
    <button id="delete-task-btn">Delete</button>
  </div>

  <div id="user-container" class="task-container"></div>

  <script src="app.js"></script>
</body>

</html>
